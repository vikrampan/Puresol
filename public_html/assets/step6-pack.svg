<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Step 6: Eco Packaging — person on bicycle with bags, brand flat illustration style -->
  <!-- No background, transparent -->

  <!-- Ground shadow -->
  <ellipse cx="200" cy="278" rx="160" ry="10" fill="#C4A882" opacity="0.2"/>

  <!-- BICYCLE -->
  <!-- Rear wheel -->
  <circle cx="148" cy="240" r="38" stroke="#3D1A08" stroke-width="5" fill="none"/>
  <circle cx="148" cy="240" r="4" fill="#3D1A08"/>
  <!-- Rear wheel spokes -->
  <g stroke="#5A2808" stroke-width="1.8" opacity="0.7">
    <line x1="148" y1="202" x2="148" y2="278"/>
    <line x1="110" y1="240" x2="186" y2="240"/>
    <line x1="121" y1="213" x2="175" y2="267"/>
    <line x1="175" y1="213" x2="121" y2="267"/>
    <line x1="110" y1="220" x2="186" y2="260"/>
    <line x1="110" y1="260" x2="186" y2="220"/>
  </g>

  <!-- Front wheel -->
  <circle cx="280" cy="240" r="38" stroke="#3D1A08" stroke-width="5" fill="none"/>
  <circle cx="280" cy="240" r="4" fill="#3D1A08"/>
  <!-- Front spokes -->
  <g stroke="#5A2808" stroke-width="1.8" opacity="0.7">
    <line x1="280" y1="202" x2="280" y2="278"/>
    <line x1="242" y1="240" x2="318" y2="240"/>
    <line x1="253" y1="213" x2="307" y2="267"/>
    <line x1="307" y1="213" x2="253" y2="267"/>
    <line x1="242" y1="220" x2="318" y2="260"/>
    <line x1="242" y1="260" x2="318" y2="220"/>
  </g>

  <!-- Bicycle frame -->
  <path d="M164 236 L200 195 L248 236" stroke="#3D1A08" stroke-width="6" stroke-linejoin="round" fill="none"/>
  <path d="M200 195 L230 236" stroke="#3D1A08" stroke-width="5" stroke-linecap="round" fill="none"/>
  <line x1="164" y1="236" x2="148" y2="240" stroke="#3D1A08" stroke-width="5" stroke-linecap="round"/>
  <line x1="248" y1="236" x2="280" y2="240" stroke="#3D1A08" stroke-width="5" stroke-linecap="round"/>
  <!-- Handlebar stem + bar -->
  <line x1="200" y1="195" x2="210" y2="182" stroke="#3D1A08" stroke-width="5" stroke-linecap="round"/>
  <line x1="205" y1="175" x2="225" y2="173" stroke="#3D1A08" stroke-width="5" stroke-linecap="round"/>
  <line x1="215" y1="169" x2="215" y2="182" stroke="#3D1A08" stroke-width="5" stroke-linecap="round"/>
  <!-- Seat post + seat -->
  <line x1="200" y1="195" x2="192" y2="180" stroke="#3D1A08" stroke-width="5" stroke-linecap="round"/>
  <path d="M178 178 Q192 173 205 177" stroke="#3D1A08" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Pedal crank -->
  <circle cx="200" cy="226" r="9" stroke="#3D1A08" stroke-width="4" fill="none"/>
  <line x1="200" y1="217" x2="200" y2="235" stroke="#3D1A08" stroke-width="2.5"/>

  <!-- RIDER / PERSON -->
  <!-- Legs -->
  <path d="M196 222 Q192 238 186 252 Q193 256 200 253 Q204 243 210 230Z" fill="#2A0E05"/>
  <path d="M204 222 Q212 236 218 250 Q225 248 226 242 Q220 230 214 218Z" fill="#3D1A08"/>
  <!-- Shoes -->
  <ellipse cx="193" cy="254" rx="12" ry="5" fill="#1E0803"/>
  <ellipse cx="222" cy="246" rx="11" ry="5" fill="#1E0803"/>

  <!-- Torso (pink shirt, brand colour) -->
  <path d="M185 170 Q182 180 183 198 Q188 215 200 220 Q212 218 218 213 Q222 198 220 183 Q216 168 207 162 Z" fill="#C8586A"/>
  <!-- Shirt stripe detail -->
  <path d="M188 172 Q196 166 206 168 Q214 172 216 180" fill="none" stroke="#E07888" stroke-width="1.5" opacity="0.6"/>
  <line x1="186" y1="185" x2="220" y2="182" stroke="#B04858" stroke-width="1" opacity="0.4"/>

  <!-- Arms -->
  <path d="M185 178 Q174 180 167 188 Q163 194 167 198 Q172 202 176 196 Q180 190 188 186Z" fill="#A84830"/>
  <path d="M217 175 Q226 178 232 186 Q236 192 232 196 Q228 198 226 192 Q220 186 215 182Z" fill="#A84830"/>

  <!-- Head -->
  <circle cx="202" cy="155" r="22" fill="#A04828"/>
  <!-- Hair / hat (wide-brim hat like harvesting man) -->
  <ellipse cx="202" cy="138" rx="28" ry="8" fill="#D4A840"/>
  <ellipse cx="202" cy="133" rx="18" ry="12" fill="#C89830"/>
  <ellipse cx="202" cy="131" rx="14" ry="8" fill="#D4A840"/>
  <!-- Face -->
  <ellipse cx="196" cy="156" rx="3" ry="3.5" fill="#7A2808" opacity="0.55"/>
  <ellipse cx="210" cy="156" rx="3" ry="3.5" fill="#7A2808" opacity="0.55"/>
  <path d="M196 164 Q202 168 208 164" stroke="#7A2808" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- PURESOL BAGS (hanging from bicycle / rider) -->
  <!-- Bag rope/strap from handlebar -->
  <path d="M148 240 Q110 238 92 230 Q86 220 90 210 Q95 200 105 210 Q115 220 128 230" stroke="#9A6840" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Bag 1 (left) -->
  <rect x="62" y="196" width="56" height="68" rx="8" fill="#F8F4FC"/>
  <rect x="62" y="196" width="56" height="68" rx="8" fill="none" stroke="#D8D0E8" stroke-width="1.5"/>
  <!-- Bag seal bottom -->
  <rect x="67" y="253" width="46" height="7" rx="3.5" fill="#E0D4EC"/>
  <!-- Bag label -->
  <rect x="70" y="206" width="40" height="30" rx="5" fill="#F0E8F8"/>
  <!-- Puresol brand mark (simplified) -->
  <rect x="75" y="212" width="30" height="3.5" rx="1.8" fill="#C0386A"/>
  <rect x="77" y="217" width="26" height="2.5" rx="1.2" fill="#9A2855" opacity="0.7"/>
  <text x="90" y="226" font-size="5.5" fill="#8A2050" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" opacity="0.8">Natural</text>
  <text x="90" y="232" font-size="4.5" fill="#8A2050" text-anchor="middle" font-family="Georgia, serif" opacity="0.65">Alkaline Salt</text>
  <!-- Handle strings -->
  <path d="M76 196 Q90 184 104 196" stroke="#C8B8D8" stroke-width="2" fill="none"/>

  <!-- Bag 2 (right, slightly behind) -->
  <rect x="310" y="200" width="50" height="62" rx="8" fill="#F8F6FC" opacity="0.92"/>
  <rect x="310" y="200" width="50" height="62" rx="8" fill="none" stroke="#D0C8E4" stroke-width="1.5" opacity="0.85"/>
  <rect x="315" y="250" width="40" height="6" rx="3" fill="#DCD0EA" opacity="0.85"/>
  <!-- Bag 2 label -->
  <rect x="318" y="208" width="34" height="26" rx="4" fill="#EDE5F5" opacity="0.85"/>
  <rect x="322" y="213" width="26" height="3" rx="1.5" fill="#C0386A" opacity="0.85"/>
  <text x="335" y="223" font-size="5" fill="#8A2050" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" opacity="0.75">Puresol</text>
  <text x="335" y="229" font-size="4" fill="#8A2050" text-anchor="middle" font-family="Georgia, serif" opacity="0.6">Super 7</text>
  <path x="325" y="200" d="M318 200 Q335 190 352 200" stroke="#B8A8CC" stroke-width="2" fill="none" opacity="0.85"/>
  <!-- Strap from rear wheel to bag -->
  <path d="M280 240 Q300 235 312 225" stroke="#9A6840" stroke-width="2" fill="none" opacity="0.65"/>
</svg>
