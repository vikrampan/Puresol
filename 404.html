<!DOCTYPE html>

<head>

  <style>
    body {
      margin: 0;
      font-family: 'DM Sans', system-ui, sans-serif;
      background: linear-gradient(180deg, #5C1A2A 0%, #3E0F1A 100%);
      color: #fff5e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .err {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem;
    }
    .err__inner { max-width: 640px; }
    .err__eyebrow {
      font-size: 0.78rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #c9a05a;
      margin: 0 0 1.5rem;
    }
    .err__code {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-size: clamp(5rem, 14vw, 9rem);
      line-height: 1;
      color: #fff5e8;
      margin: 0 0 1rem;
    }
    .err__title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      font-weight: 400;
      font-style: italic;
      margin: 0 0 1.25rem;
    }
    .err__text {
      font-size: 1rem;
      line-height: 1.75;
      color: rgba(255, 245, 232, 0.75);
      margin: 0 0 2.5rem;
    }
    .err__links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .err__btn {
      display: inline-block;
      padding: 0.85rem 1.5rem;
      border: 1px solid rgba(255, 245, 232, 0.4);
      color: #fff5e8;
      text-decoration: none;
      font-size: 0.92rem;
      letter-spacing: 0.05em;
      transition: all 0.3s ease;
    }
    .err__btn:hover {
      background: #fff5e8;
      color: #5C1A2A;
      border-color: #fff5e8;
    }
    .err__btn--primary {
      background: #c9a05a;
      border-color: #c9a05a;
      color: #2a0a14;
    }
    .err__btn--primary:hover {
      background: #fff5e8;
      border-color: #fff5e8;
    }
    .err__nav {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(255, 245, 232, 0.1);
    }
    .err__nav-title {
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #c9a05a;
      margin: 0 0 1rem;
    }
    .err__nav-links {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .err__nav-links a {
      color: rgba(255, 245, 232, 0.7);
      text-decoration: none;
      font-size: 0.92rem;
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s;
    }
    .err__nav-links a:hover {
      border-bottom-color: #c9a05a;
      color: #fff5e8;
    }
  </style>
</head>
<body>

  <section class="err">
    <div class="err__inner">
      <p class="err__eyebrow">Error 404</p>

      <p class="err__text">
        The page you were looking for doesn't exist on Puresol &mdash; perhaps it was moved,
        renamed, or never existed. Let's get you back to something useful.
      </p>

      <div class="err__links">
        <a href="/" class="err__btn err__btn--primary">Back to Home</a>
        <a href="/contact.html" class="err__btn">Contact Us</a>
      </div>

      <div class="err__nav">
        <p class="err__nav-title">Browse Puresol</p>
        <div class="err__nav-links">
          <a href="/">Home</a>
          <a href="/story.html">Our Story</a>
          <a href="/science.html">The Science</a>
          <a href="/health.html">Health Benefits</a>
          <a href="/blog.html">The Journal</a>
          <a href="/contact.html">Contact</a>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
