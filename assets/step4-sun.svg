<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Step 4: 9–12 Month Sun-Curing — large sun, white salt mounds -->
  <!-- Brand flat-illustration style, transparent background, isolated main elements -->

  <!-- Large blazing sun -->
  <circle cx="200" cy="80" r="62" fill="#FFE580" opacity="0.45"/>
  <circle cx="200" cy="80" r="46" fill="#FFD842" opacity="0.65"/>
  <circle cx="200" cy="80" r="34" fill="#FFD030"/>
  <circle cx="200" cy="80" r="22" fill="#FFE044"/>
  <!-- Sun sheen peak -->
  <circle cx="192" cy="72" r="8" fill="white" opacity="0.35"/>
  <!-- Sun rays (long) -->
  <g stroke="#FFD030" stroke-linecap="round" opacity="0.6">
    <line x1="200" y1="26" x2="200" y2="14" stroke-width="3"/>
    <line x1="200" y1="134" x2="200" y2="146" stroke-width="3"/>
    <line x1="146" y1="80" x2="134" y2="80" stroke-width="3"/>
    <line x1="254" y1="80" x2="266" y2="80" stroke-width="3"/>
    <line x1="162" y1="42" x2="153" y2="33" stroke-width="2.5"/>
    <line x1="238" y1="42" x2="247" y2="33" stroke-width="2.5"/>
    <line x1="162" y1="118" x2="153" y2="127" stroke-width="2.5"/>
    <line x1="238" y1="118" x2="247" y2="127" stroke-width="2.5"/>
  </g>

  <!-- Left salt mound (organic shape) -->
  <path d="M -5 230 C 15 190, 35 150, 55 135 C 70 125, 75 125, 82 120 C 100 140, 120 170, 140 200 C 150 215, 160 225, 165 230 Z" fill="#F5F1EB"/>
  <path d="M -5 230 C 15 190, 35 150, 55 135 C 70 125, 75 125, 82 120 C 70 150, 90 180, 75 210 C 70 220, 80 225, 78 230 Z" fill="#DDD8CE" opacity="0.55"/>
  <path d="M 82 120 C 100 140, 120 170, 140 200 C 150 215, 160 225, 165 230 L 78 230 C 80 225, 70 220, 75 210 C 90 180, 70 150, 82 120 Z" fill="#FFFCF7" opacity="0.4"/>
  <ellipse cx="80" cy="232" rx="88" ry="7" fill="#C4A882" opacity="0.22"/>

  <!-- Right salt mound (larger organic shape) -->
  <path d="M 218 228 C 240 180, 270 130, 300 105 C 315 90, 330 85, 340 82 C 360 105, 380 150, 400 190 C 415 210, 420 220, 428 228 Z" fill="#F5F1EB"/>
  <path d="M 218 228 C 240 180, 270 130, 300 105 C 315 90, 330 85, 340 82 C 320 130, 350 170, 330 205 C 320 220, 335 225, 330 228 Z" fill="#DDD8CE" opacity="0.52"/>
  <path d="M 340 82 C 360 105, 380 150, 400 190 C 415 210, 420 220, 428 228 L 330 228 C 335 225, 320 220, 335 205 C 350 170, 320 130, 340 82 Z" fill="#FFFCF7" opacity="0.36"/>
  <ellipse cx="323" cy="231" rx="110" ry="8" fill="#C4A882" opacity="0.2"/>
